name: npm diagnostics

# Temporary: finds out whether the environment token can publish, and whether
# the scope is the blocker. Publishes two throwaway packages and removes them.
# Deleted after use.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Probe publish permissions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          probe() {
            local name="$1"
            local dir
            dir=$(mktemp -d)
            cd "$dir" || return
            printf '{"name":"%s","version":"0.0.0-diag","description":"probe"}\n' \
              "$name" > package.json
            echo "=== $name ==="
            npm publish --access public 2>&1 | tail -6
            echo "exit: $?"
            cd - >/dev/null || return
          }
          probe "dynamic-effort-diag-probe"
          probe "@mrdrmccoy/diag-probe"
          echo "=== cleanup ==="
          npm unpublish dynamic-effort-diag-probe@0.0.0-diag --force 2>&1 | tail -2
          npm unpublish @mrdrmccoy/diag-probe@0.0.0-diag --force 2>&1 | tail -2
