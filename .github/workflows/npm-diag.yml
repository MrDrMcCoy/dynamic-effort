name: npm diagnostics

# Temporary: reports which npm account the environment token belongs to and
# what that token may do. Deleted after use.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Report identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "token length: ${#NODE_AUTH_TOKEN}"
          npm whoami || echo "whoami failed with $?"
          echo "--- profile ---"
          npm profile get --json 2>&1 | head -40 || true
          echo "--- tokens ---"
          npm token list 2>&1 | head -20 || true
          echo "--- scope lookup ---"
          curl -s -o /dev/null -w "user-scope:%{http_code}\n" \
            https://registry.npmjs.org/-/user/org.couchdb.user:mrdrmccoy
          curl -s -o /dev/null -w "pkg:%{http_code}\n" \
            https://registry.npmjs.org/@mrdrmccoy%2fdynamic-effort
