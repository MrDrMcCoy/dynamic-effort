name: Release

# Publishing happens only for a tag pushed on purpose. Merges to main run CI
# but never publish. A manual run packs the tarball without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test --conditions=browser test/unit

      # The tarball ships dist/, so build it and check it before packing.
      - run: npm run build
      - run: node scripts/smoke-dist.mjs

      # The tag must match package.json, so a stray tag cannot publish a
      # different version than the one that was tested.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "tag $tag does not match package.json $version" >&2
            exit 1
          fi

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  smoke:
    name: download smoke (${{ matrix.target }})
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Build first: the smoke test exercises the artifact that ships, not the
      # TypeScript sources. This also proves dist/ runs under plain node.
      - run: npm run build

      # Downloads the real release, verifies every checksum, extracts it, and
      # probes the binary. About 650 MB per job, so it runs only on a tag.
      - run: node dist/cli.js setup
